{% extends "base.html" %}
{% block title %}概览 - AIBot 知识库{% endblock %}
{% block content %}
<h2 class="mb-4">系统概览</h2>
<div class="row g-4">
  <div class="col-md-3">
    <div class="card text-center shadow-sm">
      <div class="card-body">
        <h6 class="card-title text-muted">知识片段</h6>
        <p class="display-6 mb-0">{{ kb_count }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-center shadow-sm">
      <div class="card-body">
        <h6 class="card-title text-muted">待补充问题总数</h6>
        <p class="display-6 mb-0">{{ pending_total }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-center shadow-sm">
      <div class="card-body">
        <h6 class="card-title text-muted">待处理</h6>
        <p class="display-6 mb-0 text-warning">{{ pending_open }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-center shadow-sm">
      <div class="card-body">
        <h6 class="card-title text-muted">已处理</h6>
        <p class="display-6 mb-0 text-success">{{ pending_resolved }}</p>
      </div>
    </div>
  </div>
</div>
<div class="row g-4 mt-2">
  <div class="col-md-3">
    <a href="/kb" class="btn btn-primary w-100">管理知识库</a>
  </div>
  <div class="col-md-3">
    <a href="/pending" class="btn btn-warning w-100">待补充问题</a>
  </div>
  <div class="col-md-3">
    <a href="/config" class="btn btn-secondary w-100">系统参数</a>
  </div>
</div>
{% endblock %}
